<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" fill="none">
  <defs>
    <linearGradient id="p1Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eceff1" />
      <stop offset="100%" stop-color="#cfd8dc" />
    </linearGradient>
    <pattern id="dotGrid" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#90a4ae" opacity="0.35" />
    </pattern>
  </defs>

  <!-- Background base -->
  <rect width="800" height="600" fill="url(#p1Bg)" />
  <rect width="800" height="600" fill="url(#dotGrid)" />

  <!-- Minimalist Architectural Plan / Grid Graphic -->
  <rect x="120" y="90" width="560" height="420" rx="4" stroke="#78909c" stroke-width="1.5" stroke-dasharray="6 6" fill="#f5f7f8" fill-opacity="0.8" />
  
  <!-- Architectural Layout Geometry -->
  <rect x="160" y="130" width="280" height="220" stroke="#546e7a" stroke-width="2" fill="#eceff1" />
  <rect x="480" y="130" width="160" height="340" stroke="#546e7a" stroke-width="2" fill="#eceff1" />
  <rect x="160" y="380" width="280" height="90" stroke="#78909c" stroke-width="1.5" fill="#f5f7f8" />

  <!-- Proportion Dimension Lines -->
  <line x1="160" y1="365" x2="440" y2="365" stroke="#90a4ae" stroke-width="1" />
  <line x1="160" y1="360" x2="160" y2="370" stroke="#90a4ae" stroke-width="1" />
  <line x1="440" y1="360" x2="440" y2="370" stroke="#90a4ae" stroke-width="1" />
  <text x="300" y="362" font-family="'JetBrains Mono', monospace" font-size="11" fill="#607d8b" text-anchor="middle">2,800 MM</text>

  <!-- Title & Label in JetBrains Mono / Inter -->
  <text x="160" y="115" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="500" fill="#455a64" letter-spacing="2">PROJECT 01 // SPATIAL ARCHITECTURE</text>
  <text x="640" y="115" font-family="'JetBrains Mono', monospace" font-size="12" fill="#78909c" text-anchor="end">REV. 2026</text>
</svg>
